<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lançamento LATAM · Hire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    /* base dark profissional */
    --bg:#0e1117; --bg2:#131a24; --card:#161d29; --card2:#1c2533; --border:#26303f;
    --text:#eef2f7; --sub:#8a97a8; --soft:#c3ccd8;
    /* calor latino (séries + acentos) */
    --gold:#E9C46A;      /* México */
    --agave:#2FB0A0;     /* Colômbia */
    --terra:#E07A5F;     /* Geral / Peru */
    --sun:#F4A261;       /* acento quente */
    --good:#42d392; --warn:#f0b429; --bad:#ef5f6b;
    --disp:'Bricolage Grotesque','Inter',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{font-size:16px;}
  body{
    background:
      radial-gradient(900px 500px at 88% -8%, rgba(233,196,106,.10), transparent 60%),
      radial-gradient(760px 460px at -6% 8%, rgba(47,176,160,.10), transparent 58%),
      var(--bg);
    color:var(--text); font-family:'Inter',sans-serif; line-height:1.5;
    -webkit-font-smoothing:antialiased; padding:0 18px 70px; min-height:100vh;
  }
  .wrap{max-width:1160px;margin:0 auto;}

  /* header */
  header{padding:34px 0 22px;}
  .brand{font-size:.7rem;letter-spacing:.28em;font-weight:800;text-transform:uppercase;color:var(--sun);display:flex;align-items:center;gap:9px;}
  .brand .dot{width:7px;height:7px;border-radius:50%;background:var(--terra);}
  h1{font-family:var(--disp);font-size:2.3rem;font-weight:800;letter-spacing:-.02em;margin:10px 0 3px;}
  h1 span{background:linear-gradient(92deg,var(--gold),var(--terra));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
  .h-sub{color:var(--sub);font-size:.9rem;}
  .flags{font-size:1.1rem;letter-spacing:2px;margin-top:8px;}

  /* filtros */
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:20px 0 4px;}
  .seg{display:flex;gap:4px;background:var(--card);border:1px solid var(--border);border-radius:22px;padding:4px;}
  .seg button{border:none;background:none;color:var(--sub);font-weight:700;font-size:.8rem;padding:6px 15px;border-radius:18px;cursor:pointer;font-family:inherit;transition:.15s;}
  .seg button:hover{color:var(--text);}
  .seg button.on{color:#10161f;background:linear-gradient(120deg,var(--gold),var(--sun));}
  .upd{margin-left:auto;font-size:.72rem;color:var(--sub);}
  .btn{background:var(--card);border:1px solid var(--border);color:var(--soft);border-radius:20px;padding:7px 15px;font-size:.8rem;font-weight:700;cursor:pointer;font-family:inherit;transition:.15s;}
  .btn:hover{border-color:var(--gold);color:#fff;}
  /* filtro de data */
  .datebar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px;}
  .presets{display:flex;background:var(--card);border:1px solid var(--border);border-radius:22px;overflow:hidden;padding:4px;gap:4px;}
  .preset{border:none;background:none;color:var(--sub);font-weight:700;font-size:.78rem;padding:6px 13px;border-radius:18px;cursor:pointer;font-family:inherit;transition:.15s;}
  .preset:hover{color:var(--text);}
  .preset.active{color:#10161f;background:linear-gradient(120deg,var(--agave),#3fc9b8);}
  .dbox{display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--border);border-radius:22px;padding:5px 12px;}
  .dlbl{font-size:.72rem;color:var(--sub);font-weight:600;}
  .dbox input[type=date]{background:var(--bg2);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:4px 8px;font-size:.76rem;font-family:inherit;color-scheme:dark;cursor:pointer;}
  .dbox input[type=date]:hover{border-color:var(--gold);}
  .dclear{background:none;border:none;color:var(--sub);font-size:.9rem;cursor:pointer;padding:0 4px;}
  .dclear:hover{color:var(--bad);}

  /* gauges */
  .gauges{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:18px 0 6px;}
  @media(max-width:820px){.gauges{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:460px){.gauges{grid-template-columns:1fr;}}
  .gauge{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px 16px 14px;text-align:center;position:relative;overflow:hidden;}
  .gauge .gt{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--sub);}
  .gauge svg{display:block;margin:6px auto 2px;}
  .gauge .gv{font-family:var(--disp);font-size:1.55rem;font-weight:800;}
  .gauge .gm{font-size:.72rem;color:var(--sub);margin-top:2px;}
  .gauge .gpace{font-size:.68rem;font-weight:700;margin-top:7px;padding:3px 9px;border-radius:20px;display:inline-block;}
  .pc-ok{background:rgba(66,211,146,.14);color:var(--good);}
  .pc-bad{background:rgba(239,95,107,.14);color:var(--bad);}
  .pc-warn{background:rgba(240,180,41,.14);color:var(--warn);}

  /* meta destaque */
  .metabar{background:linear-gradient(120deg,rgba(233,196,106,.10),rgba(224,122,95,.08));border:1px solid var(--border);border-radius:16px;padding:18px 22px;margin-top:16px;}
  .metabar .mt{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
  .metabar .mt .ml{font-size:.72rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--sun);}
  .metabar .mt .mv{font-family:var(--disp);font-size:1.15rem;font-weight:800;}
  .metabar .mt .mv b{color:var(--gold);} .metabar .mt .mv .sep{color:var(--sub);font-weight:600;margin:0 4px;}
  .metabar .track{height:16px;background:#0c1219;border:1px solid var(--border);border-radius:10px;overflow:hidden;}
  .metabar .fill{height:100%;border-radius:9px;background:linear-gradient(90deg,var(--gold),var(--terra));transition:width .5s;}
  .metabar .mfoot{display:flex;justify-content:space-between;margin-top:8px;font-size:.74rem;color:var(--sub);flex-wrap:wrap;gap:6px;}
  .metabar .mfoot b{color:var(--soft);}

  /* section label */
  .lbl{font-size:.72rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--sun);margin:30px 0 13px;display:flex;align-items:center;gap:10px;}
  .lbl::after{content:'';flex:1;height:1px;background:var(--border);}

  /* KPI strip */
  .kpis{display:grid;grid-template-columns:repeat(7,1fr);gap:12px;}
  @media(max-width:900px){.kpis{grid-template-columns:repeat(4,1fr);}}
  @media(max-width:560px){.kpis{grid-template-columns:repeat(2,1fr);}}
  .kpi{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:14px 15px;border-top:2px solid var(--border);}
  .kpi .kl{font-size:.64rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--sub);}
  .kpi .kv{font-family:var(--disp);font-size:1.4rem;font-weight:800;margin-top:5px;}
  .kpi.k-gold{border-top-color:var(--gold);} .kpi.k-agave{border-top-color:var(--agave);}
  .kpi.k-terra{border-top-color:var(--terra);} .kpi.k-good .kv{color:var(--good);}

  /* pesquisa (padrão WICI: cards com gráficos) */
  .pq-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:16px;}
  .pq-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px 20px;}
  .pq-card h4{font-size:.95rem;font-weight:700;color:var(--text);margin-bottom:14px;}
  .pq-card .pq-cw{position:relative;height:300px;}
  .pq-card.pq-wide{grid-column:1/-1;}
  .pq-card .wc{display:flex;flex-wrap:wrap;align-items:center;align-content:center;justify-content:center;gap:4px 18px;padding:22px 16px;min-height:180px;line-height:1.05;}
  .wcw{font-weight:800;white-space:nowrap;}

  /* landing pages */
  .lps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  @media(max-width:760px){.lps{grid-template-columns:1fr;}}
  .lpcard{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);border-left:3px solid var(--pc,var(--gold));border-radius:13px;padding:13px 16px;text-decoration:none;color:var(--text);transition:.15s;}
  .lpcard:hover{border-color:var(--pc,var(--gold));transform:translateY(-2px);}
  .lpflag{font-size:1.4rem;}
  .lpinfo{flex:1;min-width:0;display:flex;flex-direction:column;}
  .lpn{font-weight:800;font-size:.92rem;}
  .lpu{font-size:.68rem;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .lparr{color:var(--sub);font-weight:700;}

  /* país — painéis de funil (estilo LP da WICI) */
  .pfunnels{display:flex;flex-direction:column;gap:22px;}
  .pfp{background:linear-gradient(165deg,var(--card2),var(--card));border:1px solid var(--border);border-radius:16px;padding:20px 22px;box-shadow:0 4px 20px rgba(0,0,0,.25);}
  .pfp-hd{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:18px;padding-bottom:16px;border-bottom:1px solid var(--border);}
  .pfp-hl{display:flex;align-items:center;gap:10px;}
  .pfp-fl{font-size:1.5rem;}
  .pfp-nm{font-size:1.15rem;font-weight:800;}
  .pfp-sub{font-size:.72rem;color:var(--sub);}
  .pfp-r{display:flex;gap:26px;flex-wrap:wrap;}
  .pfp-ml{font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--sub);}
  .pfp-mv{font-family:var(--disp);font-size:1.35rem;font-weight:800;margin-top:2px;}
  .pfp-body{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start;}
  @media(max-width:820px){.pfp-body{grid-template-columns:1fr;}}
  .fn{display:flex;flex-direction:column;gap:5px;}
  .fn-seg{height:78px;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .fn-lbl{font-size:.64rem;font-weight:700;letter-spacing:.06em;color:rgba(255,255,255,.8);}
  .fn-val{font-family:var(--disp);font-size:1.45rem;font-weight:800;color:#fff;margin-top:2px;}
  .fn-rate{text-align:center;margin:1px 0;}
  .fn-pill{display:inline-block;font-size:.68rem;font-weight:700;color:var(--soft);background:var(--bg2);border:1px solid var(--border);padding:4px 13px;border-radius:20px;}
  .pfp-charts{display:flex;flex-direction:column;gap:14px;}
  .pfp-cc{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:12px 14px;}
  .pfp-ct{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--sub);margin-bottom:6px;}
  .pfp-ch{position:relative;height:130px;}

  /* país cards */
  .paises{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  @media(max-width:760px){.paises{grid-template-columns:1fr;}}
  .pcard{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--border);border-radius:16px;padding:18px 20px;position:relative;overflow:hidden;}
  .pcard::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--pc,var(--gold));}
  .pcard .ph{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
  .pcard .pflag{font-size:1.3rem;}
  .pcard .pn{font-weight:800;font-size:1.05rem;}
  .pcard .pn small{display:block;font-size:.66rem;font-weight:600;color:var(--sub);letter-spacing:.04em;}
  .pcard .prow{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:.86rem;}
  .pcard .prow:last-child{border-bottom:none;}
  .pcard .prow .pk{color:var(--sub);}
  .pcard .prow .pvv{font-weight:700;font-family:var(--disp);}
  .pcard .cplbig{font-family:var(--disp);font-size:1.9rem;font-weight:800;margin-top:4px;}

  /* charts */
  .charts2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media(max-width:820px){.charts2{grid-template-columns:1fr;}}
  .chart-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px 20px;}
  .chart-title{font-size:.8rem;font-weight:700;color:var(--soft);margin-bottom:12px;}
  .chart-box{position:relative;height:280px;}
  .chart-box.tall{height:320px;}

  /* tabela */
  .tbl-box{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;}
  .tbl-scroll{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:.86rem;}
  th{background:var(--card2);font-size:.62rem;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.06em;padding:11px 14px;text-align:left;white-space:nowrap;cursor:pointer;user-select:none;}
  th:hover{color:var(--gold);}
  th.num,td.num{text-align:right;}
  td{padding:11px 14px;border-top:1px solid var(--border);white-space:nowrap;}
  tr:hover td{background:rgba(233,196,106,.04);}
  .cri-nm{max-width:240px;overflow:hidden;text-overflow:ellipsis;}
  .badge{font-size:.6rem;font-weight:700;padding:2px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.04em;}
  .b-on{background:rgba(66,211,146,.14);color:var(--good);}
  .b-off{background:rgba(138,151,168,.14);color:var(--sub);}
  .b-mx{background:rgba(233,196,106,.14);color:var(--gold);}
  .b-co{background:rgba(47,176,160,.16);color:var(--agave);}
  .b-pe{background:rgba(244,162,97,.16);color:var(--sun);}
  .b-ge{background:rgba(224,122,95,.16);color:var(--terra);}
  .lnk{color:var(--gold);text-decoration:none;font-weight:600;}
  .lnk:hover{text-decoration:underline;}

  .foot{margin-top:38px;padding-top:20px;border-top:1px solid var(--border);color:var(--sub);font-size:.75rem;text-align:center;}
  .loading,.empty{padding:50px;text-align:center;color:var(--sub);}
  .err{color:var(--bad);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><span class="dot"></span> Cardô Marketing · Tráfego</div>
    <h1>Lançamento <span>LATAM</span></h1>
    <p class="h-sub">Captação de leads · El Mapa Internacional</p>
    <div class="flags">🇲🇽 🇨🇴 🇵🇪</div>
  </header>

  <div class="toolbar">
    <div class="seg" id="segView">
      <button class="on" data-v="trafego" onclick="setView(this)">📊 Tráfego</button>
      <button data-v="pesquisa" onclick="setView(this)">📋 Pesquisa</button>
    </div>
    <div class="seg" id="segPais">
      <button class="on" data-p="all" onclick="setPais(this)">Todos</button>
      <button data-p="Mexico" onclick="setPais(this)">🇲🇽 México</button>
      <button data-p="Colombia" onclick="setPais(this)">🇨🇴 Colômbia</button>
      <button data-p="Geral" onclick="setPais(this)">🌎 Geral</button>
    </div>
    <button class="btn" onclick="load()">↻ Atualizar</button>
    <span class="upd" id="upd"></span>
  </div>

  <div class="datebar">
    <div class="presets" id="presets">
      <button class="preset" data-d="1" onclick="setPreset(this)">Ontem</button>
      <button class="preset" data-d="3" onclick="setPreset(this)">3 dias</button>
      <button class="preset" data-d="7" onclick="setPreset(this)">7 dias</button>
      <button class="preset" data-d="14" onclick="setPreset(this)">14 dias</button>
      <button class="preset active" data-d="all" onclick="setPreset(this)">Tudo</button>
    </div>
    <div class="dbox">
      <span class="dlbl">De</span><input type="date" id="dDe" onchange="setDates()">
      <span class="dlbl">até</span><input type="date" id="dAte" onchange="setDates()">
      <button class="dclear" id="dClear" onclick="clearDates()" style="display:none" title="Limpar">✕</button>
    </div>
  </div>

  <div id="body"><div class="loading">Cargando datos…</div></div>

  <div class="foot" id="foot">Cardô Marketing · dados ao vivo da planilha · investimento convertido a R$ <span id="cotLbl">5,19</span>/US$</div>
</div>

<script>
  // ── Config ──
  const SHEET_ID='1kqb4KByuumeXkHRddig_gEzgBJ7QEqP6LgRrCCh_hvQ';  // investimento/criativos (Stract)
  const SHEET_LEADS='1o-e-0MAJr8JanmJcx2qotN07xqu_VcJk';  // planilha oficial do lançamento (leads reais)
  const GID_LEADS='1976465157';   // aba leads por dia · país (DATA|ORG|...|ADS COLOMBIA|MEXICO|PERU|GERAL)
  const COT=5.19;                 // US$ → R$
  const META_LEADS=2000;
  const META_CPL_USD=1.50;
  const META_INV_USD=3000;
  const CAP_INI=new Date(2026,7,31);   // 31/08
  const CAP_FIM=new Date(2026,8,20);   // 20/09 (fim da captação / abre carrinho)
  const PESQUISA_SHEET='1i-Q2Xlh6W4IqPu2tRjZyQYHaBrYJrHe4HXXp3lCtQJM';  // pesquisa de qualificação
  const LPS=[
    {nm:'Geral',   fl:'🌎', col:'var(--terra)', url:'https://hire-international.com/es/masterclass-el-mapa-internacional-ads-geral/'},
    {nm:'México',  fl:'🇲🇽', col:'var(--gold)',  url:'https://hire-international.com/es/masterclass-el-mapa-internacional-ads-mex/'},
    {nm:'Colômbia',fl:'🇨🇴', col:'var(--agave)', url:'https://hire-international.com/es/masterclass-el-mapa-internacional-ads-colombia/'},
  ];

  let DATA=[], _pais='all', _charts=[], _sort={key:'inv',dir:-1};
  let _presetDays='all', _fStart=null, _fEnd=null;
  const FLOOR=new Date(2026,7,1);   // piso: ago/2026 (início do LATAM)

  const dkey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  function cutoff(){
    if(_presetDays==='all') return FLOOR;
    const t=new Date();t.setHours(0,0,0,0);
    const c=new Date(t);c.setDate(c.getDate()-Number(_presetDays));
    return c<FLOOR?FLOOR:c;
  }
  const inRange=d=>{
    if(_fStart && d<_fStart) return false;
    if(_fEnd   && d>_fEnd)   return false;
    return d>=cutoff();
  };
  const _pDate=v=>{if(!v)return null;const p=v.split('-');return new Date(+p[0],+p[1]-1,+p[2]);};
  function setPreset(el){
    document.querySelectorAll('.preset').forEach(t=>t.classList.remove('active'));
    el.classList.add('active');_presetDays=el.dataset.d;
    _fStart=_fEnd=null;
    document.getElementById('dDe').value='';document.getElementById('dAte').value='';
    document.getElementById('dClear').style.display='none';
    render();
  }
  function setDates(){
    _fStart=_pDate(document.getElementById('dDe').value);
    _fEnd  =_pDate(document.getElementById('dAte').value);
    if(_fStart&&_fEnd&&_fStart>_fEnd){const t=_fStart;_fStart=_fEnd;_fEnd=t;
      document.getElementById('dDe').value=dkey(_fStart);document.getElementById('dAte').value=dkey(_fEnd);}
    if(_fStart||_fEnd){_presetDays='all';
      document.querySelectorAll('.preset').forEach(t=>t.classList.remove('active'));
      document.getElementById('dClear').style.display='';
    }else{document.querySelector('.preset[data-d="all"]').classList.add('active');
      document.getElementById('dClear').style.display='none';}
    render();
  }
  function clearDates(){
    _fStart=_fEnd=null;_presetDays='all';
    document.getElementById('dDe').value='';document.getElementById('dAte').value='';
    document.getElementById('dClear').style.display='none';
    document.querySelectorAll('.preset').forEach(t=>t.classList.remove('active'));
    document.querySelector('.preset[data-d="all"]').classList.add('active');
    render();
  }

  const NUM=v=>(v==null||isNaN(v))?'—':Math.round(v).toLocaleString('pt-BR');
  const USD=v=>(v==null||isNaN(v))?'—':'US$ '+Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
  const BRL=v=>(v==null||isNaN(v))?'—':'R$ '+Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
  const PCT=v=>(v==null||isNaN(v))?'—':Number(v).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+'%';
  const div=(a,b)=>b?a/b:0;
  const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  // ── gviz ──
  let _seq=0;
  function gviz(query){
    return new Promise((resolve,reject)=>{
      const cb='__lt_'+(++_seq)+'_'+Date.now();
      const s=document.createElement('script');
      const done=()=>{try{delete window[cb];}catch(e){} if(s.parentNode)s.parentNode.removeChild(s); clearTimeout(tm);};
      const tm=setTimeout(()=>{done();reject(new Error('timeout'));},25000);
      window[cb]=r=>{done(); (r&&r.table)?resolve(r.table):reject(new Error('vazio'));};

    const elC=document.getElementById('pf_c'+job.fi);
    if(elC) _charts.push(new Chart(elC,{type:'line',data:{labels:lbls,datasets:[{data:cr,borderColor:job.col,backgroundColor:'transparent',borderWidth:2,pointRadius:2,tension:.3,spanGaps:true}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>' '+PCT(c.parsed.y)}}},scales:{x:{...AX,grid:{display:false},ticks:{color:'#8a97a8',font:{size:9},maxTicksLimit:8}},y:{...AX,beginAtZero:true,ticks:{color:'#8a97a8',font:{size:9},callback:v=>v+'%'}}}}}));
    const elL=document.getElementById('pf_l'+job.fi);
    if(elL) _charts.push(new Chart(elL,{type:'bar',data:{labels:lbls,datasets:[{data:ld,backgroundColor:job.col+'99',borderColor:job.col,borderWidth:1,borderRadius:4,maxBarThickness:26}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>' '+c.parsed.y+' leads'}}},scales:{x:{...AX,grid:{display:false},ticks:{color:'#8a97a8',font:{size:9},maxTicksLimit:8}},y:{...AX,beginAtZero:true,ticks:{color:'#8a97a8',font:{size:9}}}}}}));
  }

  function kpi(l,cls,v){return `<div class="kpi ${cls}"><div class="kl">${l}</div><div class="kv">${v}</div></div>`;}
  function th(k,label,left){const ar=_sort.key===k?(_sort.dir<0?' ↓':' ↑'):'';return `<th class="${left?'':'num'}" onclick="doSort('${k}')">${label}${ar}</th>`;}

  function fillTable(rows){
    // agrega por criativo (anuncio)
    const by={};
    for(const r of rows){const k=r.anuncio||'(sem nome)';let o=by[k];
      if(!o)o=by[k]={anuncio:k,pais:r.pais,link:r.link,status:r.status,imp:0,clk:0,leads:0,inv:0};
      o.imp+=r.imp;o.clk+=r.clk;o.leads+=r.leads;o.inv+=r.cost;if(!o.link&&r.link)o.link=r.link;}
    let list=Object.values(by).map(o=>({...o,ctr:div(o.clk,o.imp)*100,cpl:div(o.inv,o.leads)}));
    list.sort((a,b)=>{let va=a[_sort.key],vb=b[_sort.key];
      if(typeof va==='number'&&typeof vb==='number')return (va-vb)*_sort.dir;
      return String(va||'').localeCompare(String(vb||''),'pt')*_sort.dir;});
    const st=s=>/ACTIVE/i.test(s)?'<span class="badge b-on">Ativo</span>':/PAUSED/i.test(s)?'<span class="badge b-off">Pausado</span>':'<span class="badge b-off">'+esc(s||'—')+'</span>';
    const pb=p=>{const m=paisMeta[p]||{cls:'',fl:'',nm:p};return `<span class="badge ${m.cls}">${m.fl} ${m.nm}</span>`;};
    document.getElementById('tb').innerHTML=list.map(o=>`<tr>
      <td class="cri-nm" title="${esc(o.anuncio)}">${esc(o.anuncio)}</td>
      <td>${pb(o.pais)}</td><td>${st(o.status)}</td>
      <td class="num">${NUM(o.imp)}</td><td class="num">${PCT(o.ctr)}</td><td class="num">${NUM(o.clk)}</td>
      <td class="num">${NUM(o.leads)}</td><td class="num">${o.leads?USD(o.cpl):'—'}</td><td class="num">${BRL(o.inv*COT)}</td>
      <td>${o.link?`<a class="lnk" href="${esc(o.link)}" target="_blank">🔗 ver</a>`:'—'}</td></tr>`).join('')
      ||'<tr><td colspan="10" class="empty">Sem criativos.</td></tr>';
  }

  const AX={grid:{color:'rgba(255,255,255,.05)'},ticks:{color:'#8a97a8',font:{size:10}}};
  function drawFunnel(imp,clk,pv,leads){
    const el=document.getElementById('cFun');if(!el)return;
    const data=[imp,clk,pv,leads], labels=['Impressões','Cliques','Página','Leads'];
    _charts.push(new Chart(el,{type:'bar',data:{labels,datasets:[{data,
      backgroundColor:['rgba(233,196,106,.30)','rgba(244,162,97,.55)','rgba(47,176,160,.6)','rgba(224,122,95,.85)'],
      borderColor:['#E9C46A','#F4A261','#2FB0A0','#E07A5F'],borderWidth:1,borderRadius:6,maxBarThickness:70}]},
      options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},
        tooltip:{callbacks:{label:c=>' '+NUM(c.parsed.x)}}},
        scales:{x:{...AX,beginAtZero:true},y:{...AX,grid:{display:false}}}}}));
  }
  function drawDia(rows){
    const el=document.getElementById('cDia');if(!el)return;
    const by={};for(const r of rows){const k=r.date.getFullYear()+'-'+String(r.date.getMonth()+1).padStart(2,'0')+'-'+String(r.date.getDate()).padStart(2,'0');const o=by[k]||(by[k]={leads:0,inv:0});o.leads+=r.leads;o.inv+=r.cost;}
    const ks=Object.keys(by).sort();const lbls=ks.map(k=>{const p=k.split('-');return p[2]+'/'+p[1];});
    _charts.push(new Chart(el,{data:{labels:lbls,datasets:[
      {type:'bar',label:'Leads',data:ks.map(k=>by[k].leads),backgroundColor:'rgba(47,176,160,.6)',borderColor:'#2FB0A0',borderWidth:1,borderRadius:5,maxBarThickness:40,yAxisID:'y'},
      {type:'line',label:'CPL (US$)',data:ks.map(k=>by[k].leads?+(by[k].inv/by[k].leads).toFixed(2):null),borderColor:'#E9C46A',backgroundColor:'transparent',borderWidth:2,pointRadius:3,pointBackgroundColor:'#E9C46A',tension:.3,spanGaps:true,yAxisID:'y1'}
    ]},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
      plugins:{legend:{labels:{color:'#c3ccd8',boxWidth:12,font:{size:11}}},
        tooltip:{callbacks:{label:c=>c.dataset.label.indexOf('CPL')>=0?' CPL: '+USD(c.parsed.y):' Leads: '+c.parsed.y}}},
      scales:{x:{...AX,grid:{display:false}},y:{...AX,beginAtZero:true,position:'left'},
        y1:{position:'right',grid:{drawOnChartArea:false},ticks:{color:'#E9C46A',font:{size:10},callback:v=>'$'+v},beginAtZero:true}}}}));
  }
  function drawPais(){
    const el=document.getElementById('cPais');if(!el)return;
    const ps=paisesAtivos();const vals=ps.map(p=>DATA.filter(r=>r.pais===p&&inRange(r.date)).reduce((s,r)=>s+r.leads,0));
    _charts.push(new Chart(el,{type:'bar',data:{labels:ps.map(p=>paisMeta[p].fl+' '+paisMeta[p].nm),datasets:[{data:vals,
      backgroundColor:['rgba(233,196,106,.7)','rgba(47,176,160,.7)','rgba(224,122,95,.7)'],borderColor:['#E9C46A','#2FB0A0','#E07A5F'],borderWidth:1,borderRadius:6,maxBarThickness:60}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>' '+NUM(c.parsed.y)+' leads'}}},
        scales:{x:{...AX,grid:{display:false}},y:{...AX,beginAtZero:true}}}}));
  }
  function drawCpl(){
    const el=document.getElementById('cCpl');if(!el)return;
    const ps=paisesAtivos();
    const vals=ps.map(p=>{const pr=DATA.filter(r=>r.pais===p&&inRange(r.date));const c=pr.reduce((s,r)=>s+r.cost,0),l=pr.reduce((s,r)=>s+r.leads,0);return l?+(c/l).toFixed(2):0;});
    _charts.push(new Chart(el,{type:'bar',data:{labels:ps.map(p=>paisMeta[p].fl+' '+paisMeta[p].nm),datasets:[{data:vals,
      backgroundColor:['rgba(233,196,106,.7)','rgba(47,176,160,.7)','rgba(224,122,95,.7)'],borderColor:['#E9C46A','#2FB0A0','#E07A5F'],borderWidth:1,borderRadius:6,maxBarThickness:60}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},
        tooltip:{callbacks:{label:c=>' CPL '+USD(c.parsed.y)}},
        annotation:false},
        scales:{x:{...AX,grid:{display:false}},y:{...AX,beginAtZero:true,ticks:{color:'#8a97a8',font:{size:10},callback:v=>'$'+v}}}}}));
  }

  // gviz numa OUTRA planilha (a oficial de leads)
  function gvizOn(sheetId,query){
    return new Promise((resolve,reject)=>{
      const cb='__gl'+(++_seq)+'_'+Date.now();const s=document.createElement('script');
      const done=()=>{try{delete window[cb];}catch(e){}if(s.parentNode)s.parentNode.removeChild(s);clearTimeout(tm);};
      const tm=setTimeout(()=>{done();reject(new Error('timeout'));},25000);
      window[cb]=r=>{done();(r&&r.table)?resolve(r.table):reject(new Error('vazio'));};
      s.onerror=()=>{done();reject(new Error('rede'));};
      s.src='https://docs.google.com/spreadsheets/d/'+sheetId+'/gviz/tq?'+query+'&tqx=responseHandler:'+cb;
      document.head.appendChild(s);
    });
  }
  // Leads REAIS por país por dia (planilha oficial). Colunas:
  // [0]DATA [2]ORG [5]ADS COLOMBIA [6]ADS MEXICO [7]ADS PERU [8]ADS GERAL
  // Devolve mapa 'YYYY-MM-DD|Pais' -> leads.
  // A planilha traz o TOTAL de leads de cada dia por país. Usamos a ÚLTIMA linha com
  // dado (o dia mais recente da captação) — não a soma dos dias — porque é o número
  // "oficial" atual do lançamento (ex.: 01/09 = 471). Devolve { dk, byPais:{Pais:n} }.
  function parseLeadsOficial(t){
    let ultimo=null;
    for(const r of (t.rows||[])){
      const c=r.c||[]; const d=cDate(c[0]); if(!d) continue;
      const co=cNum(c[5]), mx=cNum(c[6]), pe=cNum(c[7]), ge=cNum(c[8]);
      if(co+mx+pe+ge<=0) continue;   // dia sem lead ainda → ignora
      const dk=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
      ultimo={ dk, byPais:{Colombia:co, Mexico:mx, Peru:pe, Geral:ge} };
    }
    return ultimo;   // ou null se não houver dado
  }
  // Sobrepõe os leads REAIS (total oficial por país) nos criativos, distribuídos
  // proporcional aos cliques de cada criativo do país. Total por país = número da
  // planilha oficial; total geral = soma dos países (ex.: 120+190+0+161 = 471).
  function aplicarLeadsReais(rows, dados){
    rows.forEach(r=>{ r.leads=0; });          // zera os leads furados da planilha de investimento
    if(!dados) return;
    const byPais=dados.byPais;
    for(const pais in byPais){
      const total=byPais[pais]; if(total<=0) continue;
      const idxs=rows.map((r,i)=>({r,i})).filter(o=>o.r.pais===pais).map(o=>o.i);
      if(!idxs.length) continue;
      const clk=idxs.map(i=>rows[i].clk||0); const clkTot=clk.reduce((a,b)=>a+b,0);
      if(clkTot<=0){ const base=Math.floor(total/idxs.length); let resto=total-base*idxs.length;
        idxs.forEach((i,j)=>{ rows[i].leads=base+(j<resto?1:0); }); continue; }
      const raw=idxs.map((i,j)=>clk[j]/clkTot*total);
      const base=raw.map(x=>Math.floor(x)); let resto=total-base.reduce((a,b)=>a+b,0);
      const ord=raw.map((x,j)=>({j,f:x-Math.floor(x)})).sort((a,b)=>b.f-a.f);
      for(let k=0;k<ord.length&&resto>0;k++){base[ord[k].j]++;resto--;}
      idxs.forEach((i,j)=>{ rows[i].leads=base[j]; });
    }
  }

  async function load(){
    document.getElementById('body').innerHTML='<div class="loading">Cargando datos…</div>';
    try{
      const [t,tl]=await Promise.all([
        gviz('gid=0'),
        gvizOn(SHEET_LEADS,'gid='+GID_LEADS).catch(()=>null),
      ]);
      DATA=rowsParse(t);
      if(tl){ aplicarLeadsReais(DATA, parseLeadsOficial(tl)); }
      render();
    }catch(e){
      document.getElementById('body').innerHTML='<div class="empty err">Erro ao carregar: '+esc(e.message)+'</div>';
    }
  }
  load();
</script>
